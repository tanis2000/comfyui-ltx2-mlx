[project]
name = "comfyui-ltx2-mlx"
description = "ComfyUI nodes for running Lightricks LTX-2.3 video generation natively on Apple Silicon via MLX (ltx-2-mlx), including text-to-video, image-to-video, and audio-to-video."
version = "0.1.1"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.20.0",
    "soundfile",
    "ltx-core-mlx @ git+https://github.com/dgrauet/ltx-2-mlx.git#subdirectory=packages/ltx-core-mlx",
    "ltx-pipelines-mlx @ git+https://github.com/dgrauet/ltx-2-mlx.git#subdirectory=packages/ltx-pipelines-mlx",
    "huggingface_hub",
]
classifiers = [
    "Operating System :: MacOS",
    "Environment :: GPU",
]

[project.urls]
Repository = "https://github.com/vrgamegirl19/comfyui-ltx2-mlx"
"Bug Tracker" = "https://github.com/vrgamegirl19/comfyui-ltx2-mlx/issues"

[tool.comfy]
PublisherId = "tanis2000"
DisplayName = "LTX-2 MLX (Apple Silicon)"
